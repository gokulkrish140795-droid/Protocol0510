<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Birthday AR Scavenger Hunt</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>

    <!-- UI Overlay -->
    <div id="ui-layer">
      <div class="top-hud"><div></div></div>

      <div id="guidance-box" class="guidance-box interactive">
        Tap below to start your birthday AR experience!
      </div>

      <div class="bottom-controls">
        <button id="main-action-btn" class="action-btn interactive">
          <span>✨ Start AR</span>
        </button>
      </div>
    </div>

    <!-- AR Container -->
    <div id="ar-container">
      <a-scene
        id="ar-scene"
        mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
        embedded
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >
      <a-assets timeout="10000">
        <!-- Target 0: Uncle Memorial (marker1.jpg) -->
        <video
          id="video-memorial"
          src="./assets/memorial.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>

        <!-- Target 1: Birthday Wishes (marker0.jpg) — swap to montage.mp4 for release -->
        <video
          id="video-montage"
          src="./assets/dummy.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera id="main-camera" position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Uncle Memorial (marker1.jpg) -->
      <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>

      <!-- Target 1: Birthday Wishes (marker0.jpg) -->
      <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>

      </a-scene>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
